{% extends "base.html" %}

{% block title %}Register - Secure File Share{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <p class="eyebrow">Create account</p>
            <h1 class="h3 mb-2">Start secure sharing</h1>
            <p class="text-secondary mb-4">Register to upload encrypted files and generate one-time download links.</p>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="username">Username</label>
                    <input class="form-control form-control-lg" id="username" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold" for="password">Password</label>
                    <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                    <div class="form-text">Use at least 8 characters.</div>
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">Create Account</button>
            </form>

            <p class="text-secondary text-center mt-4 mb-0">
                Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
