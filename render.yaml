services:
  - type: web
    name: secure-one-time-file-share
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run:app init-db && gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: BEHIND_PROXY
        value: "1"
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_BUCKET
        value: encrypted-files
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
